<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ollama</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.5 system-ui, sans-serif; background: #171717; color: #eee; }
    body { max-width: 920px; margin: 0 auto; padding: 28px 18px; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
    h1 { font-size: 22px; margin: 0; } select, button, textarea { font: inherit; }
    select, textarea, button { background: #242424; color: inherit; border: 1px solid #444; border-radius: 8px; padding: 9px; }
    button { cursor: pointer; } button:hover { background: #333; }
    #status { color: #aaa; margin: 6px 0 22px; }
    #chat { display: grid; gap: 16px; }
    .message { border-radius: 10px; padding: 13px 16px; white-space: pre-wrap; }
    .message img { display: block; max-width: min(520px, 100%); max-height: 360px; margin-top: 10px; border-radius: 7px; }
    .user { background: #26384a; } .assistant { background: #222; }
    .assistant h3 { margin: 0 0 5px; font-size: 15px; color: #ddd; }
    .assistant pre { overflow-x: auto; margin: 5px 0; } .assistant ul { margin: 4px 0; }
    form { margin-top: 22px; } textarea { width: 100%; box-sizing: border-box; min-height: 78px; resize: vertical; }
    .controls { display: flex; gap: 9px; align-items: center; margin-top: 9px; }
    .spacer { flex: 1; } .drop { color: #aaa; font-size: 13px; }
    #preview { display: flex; gap: 8px; margin-top: 8px; } #preview img { max-height: 100px; max-width: 150px; border-radius: 6px; }
    .error { color: #ff9c9c; white-space: pre-wrap; }
    #lightbox { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 30px; background: rgb(0 0 0 / 82%); cursor: zoom-out; }
    #lightbox[hidden] { display: none; } #lightbox img { max-width: 95vw; max-height: 90vh; object-fit: contain; border-radius: 8px; }
    #lightbox button { position: fixed; top: 18px; right: 22px; border: 0; background: transparent; font-size: 28px; cursor: pointer; }
  </style>
</head>
<body>
  <header><h1>Ollama</h1></header>
  <div id="status">Connecting and loading model…</div>
  <main id="chat"></main>
  <form id="form">
    <textarea id="prompt" autofocus placeholder="Ask anything… Paste or drop an image here"></textarea>
    <div id="preview"></div>
    <div class="controls"><button type="button" id="attach">Attach image</button><input id="file" type="file" accept="image/*" hidden><span class="drop">Images can be pasted or dropped into the prompt</span><span class="spacer"></span><button>Send</button></div>
  </form>
  <div id="lightbox" hidden role="dialog" aria-label="Image preview"><button type="button" aria-label="Close image preview">×</button><img alt="Full-size preview"></div>
  <script>
    const $ = (id) => document.getElementById(id);
    const promptBox = $('prompt'), preview = $('preview'), chat = $('chat'), status = $('status');
    let images = [], history = [], busy = false;

    function addImage(file) {
      const reader = new FileReader();
      reader.onload = () => { images.push({ name: file.name || 'clipboard-image', type: file.type || 'image/png', data: reader.result.split(',')[1] }); renderPreview(); };
      reader.readAsDataURL(file);
    }
    function renderPreview() { preview.replaceChildren(...images.map((image, index) => { const img = document.createElement('img'); img.src = `data:${image.type};base64,${image.data}`; img.title = image.name; img.onclick = () => { images.splice(index, 1); renderPreview(); }; return img; })); }
    function text(value) { const node = document.createElement('span'); node.textContent = String(value); return node; }
    function renderValue(value, parent) {
      if (value === null || typeof value !== 'object') { parent.append(text(value)); return; }
      if (Array.isArray(value)) { const list = document.createElement('ul'); value.forEach((item) => { const li = document.createElement('li'); renderValue(item, li); list.append(li); }); parent.append(list); return; }
      Object.entries(value).forEach(([key, child]) => { const section = document.createElement('section'); const heading = document.createElement('h3'); heading.textContent = key.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/[_-]/g, ' '); section.append(heading); renderValue(child, section); parent.append(section); });
    }
    function showLightbox(image) { const lightbox = $('lightbox'); const full = lightbox.querySelector('img'); full.src = `data:${image.type};base64,${image.data}`; full.alt = image.name; lightbox.hidden = false; }
    function closeLightbox() { $('lightbox').hidden = true; $('lightbox').querySelector('img').removeAttribute('src'); }
    function addMessage(role, value, attached = []) { const box = document.createElement('div'); box.className = `message ${role}`; if (role === 'assistant') box.textContent = value; else { const copy = document.createElement('div'); copy.textContent = value; box.append(copy); attached.forEach((image) => { const img = document.createElement('img'); img.src = `data:${image.type};base64,${image.data}`; img.alt = image.name; img.title = 'Click to enlarge'; img.onclick = () => showLightbox(image); box.append(img); }); } chat.append(box); box.scrollIntoView({ behavior: 'smooth', block: 'end' }); return box; }
    async function send(event) {
      event.preventDefault(); if (busy || !promptBox.value.trim() && !images.length) return;
      busy = true; const content = promptBox.value.trim() || 'Describe this image.'; const attachedImages = [...images]; const attached = attachedImages.map((image) => image.data); addMessage('user', content, attachedImages);
      const userMessage = { role: 'user', content, ...(attached.length ? { images: attached } : {}) }; history.push(userMessage); promptBox.value = ''; images = []; renderPreview(); status.textContent = 'Generating…';
      try {
        const response = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ messages: history }) });
        if (!response.ok) throw new Error((await response.json()).error || response.statusText);
        const reader = response.body.getReader(), decoder = new TextDecoder(); let buffer = '', answer = ''; const assistantBox = addMessage('assistant', '');
        while (true) { const { done, value } = await reader.read(); buffer += decoder.decode(value || new Uint8Array(), { stream: !done }); const events = buffer.split('\n\n'); buffer = events.pop() || ''; for (const event of events) { const line = event.split('\n').find((item) => item.startsWith('data: ')); if (!line) continue; const data = JSON.parse(line.slice(6)); if (data.type === 'delta') { answer += data.content; assistantBox.textContent = answer; assistantBox.scrollIntoView({ behavior: 'smooth', block: 'end' }); } if (data.type === 'error') throw new Error(data.error); } if (done) break; }
        history.push({ role: 'assistant', content: answer }); status.textContent = 'Ready';
      } catch (error) { addMessage('assistant', `Error: ${error.message}`); status.textContent = 'Error'; }
      finally { busy = false; promptBox.focus(); }
    }
    $('attach').onclick = () => $('file').click(); $('file').onchange = () => [...$('file').files].forEach(addImage); promptBox.ondragover = (event) => event.preventDefault(); promptBox.ondrop = (event) => { event.preventDefault(); [...event.dataTransfer.files].filter((file) => file.type.startsWith('image/')).forEach(addImage); }; promptBox.onpaste = (event) => [...event.clipboardData.items].filter((item) => item.type.startsWith('image/')).forEach((item) => addImage(item.getAsFile())); promptBox.onkeydown = (event) => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); $('form').requestSubmit(); } }; $('form').onsubmit = send;
    $('lightbox').onclick = (event) => { if (event.target === $('lightbox') || event.target.tagName === 'BUTTON') closeLightbox(); }; document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && !$('lightbox').hidden) closeLightbox(); });
    async function init() { try { const data = await (await fetch('/api/status')).json(); if (data.error) throw new Error(data.error); status.textContent = `Ready · Ollama ${data.version}`; } catch (error) { status.textContent = `Error: ${error.message}`; status.className = 'error'; } }
    init();
  </script>
</body>
</html>
