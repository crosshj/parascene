<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parascene finances</title>
<style>
	body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
	main { max-width: 700px; margin: 2em auto; padding: 0 1em; }
	button { appearance: none; border: 1px solid #888; border-radius: 4px; background: #fafafa; font: inherit; font-size: .9em; line-height: 1; padding: 2px 7px; }
	button:hover { background: #f1f1f1; }
	section { margin-top: 1.5em; }
	fieldset { margin: 1em 0; }
	label { display: block; margin: .75em 0; }
	label input, label select { display: block; margin-top: .25em; }
	textarea { width: 100%; box-sizing: border-box; }
	.ledger { display: grid; gap: .2rem; }
	.ledger-brand { margin-bottom: .8rem; }
	.ledger-brand svg { display: block; width: 150px; height: 30px; }
	.ledger-brand .logo-text path { fill: #222; }
	.ledger-brand .logo-muted { opacity: .55; }
	.ledger-row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 7rem; align-items: center; column-gap: .5rem; padding: .65rem .75rem; border-radius: 4px; }
	.ledger-row[data-entry-kind] { cursor: pointer; }
	.ledger-row[data-entry-kind]:hover { background: #f5f5f5; }
	.ledger-row:focus { outline: none; box-shadow: none; }
	.ledger-row.dragging { color: #999; }
	.amount-column { white-space: nowrap; text-align: right; }
	.ledger-row.drop-before::before,
	.ledger-row.drop-after::after { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: #555; pointer-events: none; }
	.ledger-row.drop-before::before { top: 0; }
	.ledger-row.drop-after::after { bottom: 0; }
	.ghost-row { grid-template-columns: 1fr; border: 1px dashed transparent; box-sizing: border-box; color: #c8c8c8; cursor: pointer; justify-items: center; }
	.ghost-row:hover { border-color: #555; color: #555; }
	.monthly-net-row { position: relative; margin-top: .9rem; font-weight: 500; padding-top: .9rem; }
	.monthly-net-row::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: #888; }
	.monthly-net-row .amount-column { font-size: 1.05em; }
	@media (max-width: 600px) { .ledger-row { grid-template-columns: minmax(0, 1fr) 7rem; } }
	dialog { width: min(32rem, calc(100vw - 2rem)); box-sizing: border-box; padding: 1.25rem; border: 1px solid #d6d6d6; border-radius: 8px; box-shadow: 0 12px 32px rgb(0 0 0 / 16%); font: inherit; color: inherit; }
	dialog::backdrop { background: rgb(0 0 0 / 24%); }
	dialog h2 { margin: 0; font-size: 1.15rem; font-weight: 500; }
	.dialog-heading { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
	.entry-fields { margin: 0; padding: 0; border: 0; }
	.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem .75rem; }
	.form-grid label { margin: 0; }
	.form-grid label.full-width { grid-column: 1 / -1; }
	.form-grid input:not([type="checkbox"]),
	.form-grid select { width: 100%; box-sizing: border-box; margin-top: .35rem; padding: .55rem .65rem; border: 1px solid #bdbdbd; border-radius: 4px; background: #fff; color: inherit; font: inherit; }
	.form-grid select { appearance: none; padding-right: 2rem; background-image: linear-gradient(45deg, transparent 50%, #666 50%), linear-gradient(135deg, #666 50%, transparent 50%); background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
	.form-grid input:focus, .form-grid select:focus { outline: 2px solid #9bbbe8; outline-offset: 1px; border-color: #6d91c4; }
	.checkbox-field { display: flex; align-items: center; gap: .45rem; margin: 0; white-space: nowrap; }
	.checkbox-field input { margin: 0; }
	.dialog-actions { display: flex; align-items: center; gap: .5rem; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid #e5e5e5; }
	.dialog-actions #deleteEntry { margin-right: auto; color: firebrick; }
	.dialog-actions button { min-height: 2rem; padding: .45rem .8rem; }
	.dialog-actions .text-button { border-color: transparent; background: transparent; }
	.dialog-actions .text-button:hover { background: #f5f5f5; }
	@media (max-width: 520px) { .form-grid { grid-template-columns: 1fr; } .form-grid label.full-width { grid-column: auto; } }
	.income { color: green; }
	.expense { color: firebrick; }
	.estimate { font-size: .9em; }
	#status:empty { display: none; }
</style>

2 29.344 106.409 28.315 Q 104.546 27.287 103.544 25.433 Q 102.542 23.578 102.542 21.082 Q 102.542 18.814 103.263 16.661 Q 103.983 14.508 105.389 12.794 Q 106.796 11.08 108.87 10.069 Q 110.944 9.059 113.669 9.059 Q 115.444 9.059 116.886 9.516 Q 118.327 9.973 119.373 10.834 Q 120.419 11.695 120.99 12.908 Q 121.561 14.121 121.597 15.633 L 116.587 16.477 Q 116.534 15.703 116.349 15.105 Q 116.165 14.508 115.805 14.077 Q 115.444 13.646 114.908 13.427 Q 114.372 13.277 113.616 13.207 Q 112.139 13.207 111.041 13.963 Q 109.942 14.719 109.239 15.932 Q 108.536 17.145 108.193 18.551 Q 107.85 19.957 107.85 21.24 Q 107.85 22.418 108.184 23.314 Q 108.518 24.211 109.23 24.703 Q 109.942 25.195 111.05 25.195 Q 111.841 25.195 112.561 24.949 Q 113.282 24.703 113.889 24.246 Q 114.495 23.789 114.97 23.147 Q 115.444 22.506 115.725 21.715 L 120.489 22.699 Q 119.962 24.246 119.056 25.468 Q 118.151 26.689 116.921 27.56 Q 115.69 28.43 114.17 28.887 Q 112.649 29.344 110.891 29.344 Z"></path>

</main>
	<dialog id="transactionDialog">
	<form id="txForm" method="dialog">
		<div class="dialog-heading">
			<h2 id="transactionDialogTitle">Add entry</h2>
			<label id="activeField" class="checkbox-field"><input name="active" type="checkbox"> Active</label>
		</div>
		<fieldset class="entry-fields">
			<div class="form-grid">
				<label class="full-width"><span id="entryNameLabel">Name</span> <input name="vendor" placeholder="Replicate, Stripe, ..."></label>
				<label id="cadenceField">Cadence <select name="cadence"><option value="one-time">One-time</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="quarterly">Quarterly</option><option value="yearly">Yearly</option></select></label>
				<label>Type <select name="type"><option value="expense">Expense</option><option value="income">Income</option></select></label>
				<label class="full-width">Amount <input name="amount" type="number" min="0" step="0.01" required></label>
			</div>
		</fieldset>
		<div class="dialog-actions">
			<button id="deleteEntry" type="button" hidden>Delete</button>
			<button id="cancelEntry" class="text-button" type="button">Cancel</button>
			<button id="transactionSubmit" value="default">Add entry</button>
		</div>
	</form>
</dialog>
<script>
let ledger;
let editingEntryId = null;
let editingEntryKind = null;
let initialFormState = '';
	const amount = n => Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status = s => document.querySelector('#status').textContent=s;
function render(){
	const recurring=ledger.recurring.filter(x=>x.active);
	const recurringMonthly=recurring.reduce((sum,item)=>{const amount=Number(item.amount||0)*(item.cadence==='yearly'?1/12:item.cadence==='quarterly'?1/3:item.cadence==='weekly'?52/12:1);return sum+(item.type==='income'?amount:-amount);},0);
	const irregularNet=ledger.transactions.reduce((sum,item)=>sum+(item.type==='income'?1:-1)*Number(item.amount||0),0);
	const monthlyNet=recurringMonthly+(irregularNet/12);
	const entries=orderedEntries();
	document.querySelector('#entries').innerHTML=entries.map(({kind,entry,name,cadence,estimate})=>{const monthlyAmount=kind==='transaction'?Number(entry.amount||0)/12:Number(entry.amount||0)*(entry.cadence==='yearly'?1/12:entry.cadence==='quarterly'?1/3:entry.cadence==='weekly'?52/12:1);const signedAmount=entry.type==='expense'?-monthlyAmount:monthlyAmount;return `<div class="ledger-row" data-entry-kind="${kind}" data-entry-id="${esc(entry.id)}" draggable="true" tabindex="0" role="button"><div>${esc(name)}${estimate?' <span class="estimate">estimate</span>':''}</div><div class="amount-column">${amount(signedAmount)}</div></div>`;}).join('')+`<div class="ledger-row ghost-row" data-add-entry tabindex="0" role="button"><div>Add Entry</div></div><div class="ledger-row monthly-net-row"><div>Monthly net</div><div class="amount-column">${amount(monthlyNet)}</div></div>`;
}
function orderedEntries(){return [...ledger.transactions.map(x=>({kind:'transaction',entry:x,date:x.date,name:x.vendor,cadence:'one-time'})),...ledger.recurring.map(x=>({kind:'recurring',entry:x,date:x.nextDue||'',name:x.name,cadence:x.cadence,estimate:x.estimate}))].sort((a,b)=>Number(a.entry.sortOrder||999)-Number(b.entry.sortOrder||999));}
async function load(){ const r=await fetch('/api/ledger'); if(!r.ok) throw new Error((await r.json()).error); ledger=await r.json(); render(); }
async function persist() { try { const r=await fetch('/api/ledger',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(ledger)}); if(!r.ok)throw new Error((await r.json()).error); ledger=await r.json(); render(); } catch(e) { status(`Save failed: ${e.message}`); } }
const transactionDialog=document.querySelector('#transactionDialog');
const txForm=document.querySelector('#txForm');
const updateEntryMode=()=>{const recurring=txForm.elements.cadence.value!=='one-time';document.querySelector('#entryNameLabel').textContent='Name';document.querySelector('#activeField').hidden=!recurring;};
const formState=()=>JSON.stringify({type:txForm.elements.type.value,amount:txForm.elements.amount.value,vendor:txForm.elements.vendor.value,cadence:txForm.elements.cadence.value,active:txForm.elements.active.checked});
const formIsDirty=()=>formState()!==initialFormState;
const closeEntry=()=>{if(!formIsDirty()||window.confirm('Discard your changes?'))transactionDialog.close();};
const openEntry=(kind='transaction',entry=null)=>{editingEntryKind=kind;editingEntryId=entry?.id||null;const cadence=entry?.cadence|| (kind==='recurring'?'monthly':'one-time');const recurring=cadence!=='one-time';document.querySelector('#transactionDialogTitle').textContent=editingEntryId?'Edit entry':'Add entry';document.querySelector('#transactionSubmit').textContent=editingEntryId?'Save':'Add entry';document.querySelector('#deleteEntry').hidden=!editingEntryId;txForm.elements.type.value=entry?.type||'expense';txForm.elements.amount.value=entry?.amount??'';txForm.elements.vendor.value=entry?.vendor||entry?.name||'';txForm.elements.cadence.value=cadence;txForm.elements.active.checked=entry?.active!==false;updateEntryMode();initialFormState=formState();transactionDialog.showModal();};
const openRowEntry=row=>{const collection=row.dataset.entryKind==='recurring'?ledger.recurring:ledger.transactions;const entry=collection.find(x=>String(x.id)===row.dataset.entryId);if(entry)openEntry(row.dataset.entryKind,entry);};
let draggedRow = null;
let dragImage = null;
let dropRow = null;
let dropAfter = false;
const clearDropMarker=()=>{if(dropRow)dropRow.classList.remove('drop-before','drop-after');dropRow=null;};
const reorderDraggedRow=()=>{if(!draggedRow||!dropRow||draggedRow===dropRow)return;const entries=orderedEntries();const from=entries.findIndex(row=>row.kind===draggedRow.dataset.entryKind&&String(row.entry.id)===draggedRow.dataset.entryId);const target=entries.findIndex(row=>row.kind===dropRow.dataset.entryKind&&String(row.entry.id)===dropRow.dataset.entryId);if(from<0||target<0)return;const [moved]=entries.splice(from,1);let insertAt=entries.findIndex(row=>row.kind===dropRow.dataset.entryKind&&String(row.entry.id)===dropRow.dataset.entryId);if(dropAfter)insertAt++;entries.splice(insertAt,0,moved);entries.forEach((row,index)=>{row.entry.sortOrder=index+1;});ledger.transactions=entries.filter(row=>row.kind==='transaction').map(row=>row.entry);ledger.recurring=entries.filter(row=>row.kind==='recurring').map(row=>row.entry);render();persist();};
document.querySelector('#entries').addEventListener('click',e=>{const add=e.target.closest('[data-add-entry]');if(add){e.preventDefault();openEntry();return;}const row=e.target.closest('[data-entry-kind]');if(row)openRowEntry(row);});
document.querySelector('#entries').addEventListener('dragstart',e=>{const row=e.target.closest('[data-entry-kind]');if(!row)return;draggedRow=row;row.classList.add('dragging');dragImage=document.createElement('img');dragImage.src='data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';dragImage.alt='';dragImage.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none';document.body.append(dragImage);e.dataTransfer.setDragImage(dragImage,0,0);e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',row.dataset.entryId);});
document.querySelector('#entries').addEventListener('dragover',e=>{const row=e.target.closest('[data-entry-kind]');if(!row||row===draggedRow)return;e.preventDefault();clearDropMarker();dropRow=row;dropAfter=e.clientY>row.getBoundingClientRect().top+row.getBoundingClientRect().height/2;row.classList.add(dropAfter?'drop-after':'drop-before');e.dataTransfer.dropEffect='move';});
document.querySelector('#entries').addEventListener('drop',e=>{const row=e.target.closest('[data-entry-kind]');if(!row)return;e.preventDefault();reorderDraggedRow();draggedRow=null;clearDropMarker();});
document.querySelector('#entries').addEventListener('dragend',()=>{draggedRow?.classList.remove('dragging');draggedRow=null;dragImage?.remove();dragImage=null;clearDropMarker();});
document.querySelector('#entries').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const add=e.target.closest('[data-add-entry]');if(add){e.preventDefault();openEntry();return;}const row=e.target.closest('[data-entry-kind]');if(row){e.preventDefault();openRowEntry(row);}});
txForm.elements.cadence.addEventListener('change',updateEntryMode);
document.querySelector('#cancelEntry').addEventListener('click',closeEntry);
transactionDialog.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeEntry();}});
transactionDialog.addEventListener('cancel',e=>{e.preventDefault();closeEntry();});
transactionDialog.addEventListener('click',e=>{if(e.target===transactionDialog)closeEntry();});
document.querySelector('#deleteEntry').addEventListener('click',()=>{if(!editingEntryId||!confirm('Delete this item?'))return;const collection=editingEntryKind==='recurring'?ledger.recurring:ledger.transactions;const index=collection.findIndex(x=>String(x.id)===String(editingEntryId));if(index>=0)collection.splice(index,1);editingEntryId=null;editingEntryKind=null;transactionDialog.close();render();persist();});
txForm.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const recurring=f.get('cadence')!=='one-time';const next=recurring?{id:editingEntryId||crypto.randomUUID(),name:f.get('vendor'),type:f.get('type'),amount:Number(f.get('amount')),cadence:f.get('cadence'),active:f.get('active')==='on'}:{id:editingEntryId||crypto.randomUUID(),type:f.get('type'),amount:Number(f.get('amount')),vendor:f.get('vendor'),status:'actual'};if(editingEntryId){const oldCollection=editingEntryKind==='recurring'?ledger.recurring:ledger.transactions;const oldIndex=oldCollection.findIndex(x=>String(x.id)===String(editingEntryId));const oldEntry=oldIndex>=0?oldCollection.splice(oldIndex,1)[0]:null;(recurring?ledger.recurring:ledger.transactions).push(oldEntry?{...oldEntry,...next}:next);}else (recurring?ledger.recurring:ledger.transactions).push(next);editingEntryId=null;editingEntryKind=null;transactionDialog.close();render();persist();});
load().catch(e=>status(e.message));
</script>
