<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="robots" content="noindex" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Suno</title>
	<style>
		html,
		body {
			height: 100%;
			margin: 0;
			overflow: hidden;
			background: #000;
		}

		a {
			position: relative;
			box-sizing: border-box;
			display: flex;
			align-items: center;
			gap: 16px;
			width: 100%;
			height: 100%;
			padding: 8px 10px 8px 8px;
			overflow: hidden;
			color: #f7f4ef;
			text-decoration: none;
			font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
			user-select: none;
			-webkit-tap-highlight-color: transparent;
			container-type: size;
		}

		.bg {
			position: absolute;
			inset: -30%;
			z-index: 0;
			width: 160%;
			height: 160%;
			object-fit: cover;
			filter: blur(48px) saturate(1.15);
			opacity: 0.55;
			pointer-events: none;
		}

		.bg[hidden] {
			display: none;
		}

		a::before {
			content: '';
			position: absolute;
			inset: 0;
			z-index: 1;
			pointer-events: none;
			background: linear-gradient(105deg, rgba(8, 14, 28, 0.42) 0%, rgba(16, 28, 52, 0.38) 55%, rgba(10, 18, 40, 0.55) 100%);
		}

		.art,
		.main,
		.out,
		.wordmark {
			position: relative;
			z-index: 2;
		}

		.art {
			flex: 0 0 auto;
			height: 100%;
			aspect-ratio: 1 / 1;
			border-radius: 6px;
			overflow: hidden;
			background: rgba(255, 255, 255, 0.06);
			box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
		}

		.art img {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.art img[hidden] {
			display: none;
		}

		.main {
			flex: 1 1 auto;
			min-width: 0;
			display: flex;
			flex-direction: column;
			justify-content: center;
			gap: 12px;
			padding-right: 88px;
		}

		.title {
			overflow: hidden;
			font-size: clamp(14px, 12cqh, 18px);
			font-weight: 700;
			line-height: 1.2;
			letter-spacing: -0.01em;
			white-space: nowrap;
			text-overflow: ellipsis;
		}

		.controls {
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.play {
			flex: 0 0 auto;
			display: grid;
			place-items: center;
			width: clamp(40px, 34cqh, 56px);
			height: clamp(40px, 34cqh, 56px);
			border-radius: 50%;
			background: #f3efe6;
			color: #161616;
		}

		.play svg {
			display: block;
			width: 38%;
			height: 42%;
			margin-left: 6%;
			fill: currentColor;
		}

		.time {
			flex: 0 0 auto;
			font-size: clamp(10px, 8cqh, 12px);
			font-variant-numeric: tabular-nums;
			letter-spacing: 0.02em;
			color: rgba(247, 244, 239, 0.55);
		}

		.slider {
			position: relative;
			flex: 1 1 auto;
			min-width: 0;
			height: 3px;
			border-radius: 999px;
			background: rgba(247, 244, 239, 0.28);
		}

		.slider::before {
			content: '';
			position: absolute;
			top: 50%;
			left: 0;
			width: 12px;
			height: 12px;
			border-radius: 50%;
			background: #a8b0bc;
			transform: translateY(-50%);
		}

		.out {
			position: absolute;
			top: 10px;
			right: 12px;
			display: grid;
			place-items: center;
			width: 16px;
			height: 16px;
			color: rgba(247, 244, 239, 0.55);
		}

		.out svg {
			display: block;
			width: 16px;
			height: 16px;
			stroke: currentColor;
			fill: none;
			stroke-width: 1.8;
			stroke-linecap: round;
			stroke-linejoin: round;
		}

		.meta {
			flex: 0 0 auto;
			position: relative;
		}

		.suno-mark-defs {
			position: absolute;
			width: 0;
			height: 0;
			overflow: hidden;
		}

		.wordmark {
			color: #fff;
			line-height: 0;
		}

		.wordmark svg {
			display: block;
			width: auto;
			height: 100%;
			fill: currentColor;
		}

		.wordmark-inline {
			display: none;
		}

		.wordmark-corner {
			position: absolute;
			right: 12px;
			bottom: 8px;
			height: clamp(14px, 13cqh, 22px);
		}

		@media (max-height: 110px) {
			a {
				gap: 0;
				padding: 8px;
				-webkit-font-smoothing: antialiased;
			}

			a::before {
				background: linear-gradient(to bottom, rgb(30, 41, 96), rgb(28, 28, 28));
				background: linear-gradient(in oklab, rgb(30, 41, 96) 0%, rgb(28, 28, 28) 100%);
			}

			.bg,
			.art {
				display: none;
			}

			.main {
				gap: 8px;
				height: 100%;
				padding-right: 0;
				justify-content: center;
			}

			.title {
				height: 24px;
				font-size: 16px;
				font-weight: 700;
				line-height: 24px;
				letter-spacing: 0;
				color: #f7f4ef;
			}

			.controls {
				gap: 16px;
				height: 52px;
				padding-right: 0;
				align-items: center;
			}

			.play {
				width: 52px;
				height: 52px;
				background: #f7f4ef;
				color: #1c1c1f;
			}

			.time {
				font-size: 12px;
				line-height: 16px;
				color: #c2c2c1;
			}

			.slider {
				height: 4px;
				background: #6a6a72;
			}

			.slider::before {
				width: 14px;
				height: 14px;
				background: #a3a3a3;
			}

			.meta {
				display: flex;
				align-items: center;
				height: 52px;
				padding-right: 8px;
			}

			.meta .time {
				display: block;
			}

			.out {
				display: none;
			}

			.wordmark-inline {
				display: none;
			}

			.wordmark-corner {
				display: flex;
				align-items: flex-end;
				right: 8px;
				bottom: 8px;
				width: 48px;
				height: 16px;
				overflow: hidden;
			}

			.wordmark-corner svg {
				display: block;
				width: 48px;
				height: 12px;
			}
		}
	</style>
</head>

	</svg>
	<a id="open" target="_blank" rel="noopener noreferrer">
		<img class="bg" id="bg" alt="" hidden />
		<span class="art">
			<img id="cover" alt="" hidden />
		</span>
		<span class="main">
			<span class="title" id="title">Suno song</span>
			<span class="controls">
				<span class="play" aria-hidden="true">
					<svg viewBox="0 0 12 14"><path d="M1 1.15 11.2 7 1 12.85z"></path></svg>
				</span>
				<span class="time">0:00</span>
				<span class="slider" aria-hidden="true"></span>
				<span class="meta">
					<span class="time">0:00</span>
					<span class="wordmark wordmark-inline" aria-hidden="true">
						<svg viewBox="0 0 606 149"><use href="#suno-wordmark"></use></svg>
					</span>
				</span>
			</span>
		</span>
		<span class="out" aria-hidden="true">
			<svg viewBox="0 0 24 24">
				<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
				<path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
			</svg>
		</span>
		<span class="wordmark wordmark-corner" aria-hidden="true">
			<svg viewBox="0 0 606 149"><use href="#suno-wordmark"></use></svg>
		</span>
	</a>
	<script>
		(function () {
			var UUID =
				/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i;
			var params = new URLSearchParams(window.location.search);
			var id = String(params.get('id') || '').trim();
			var open = document.getElementById('open');
			var titleEl = document.getElementById('title');
			var coverEl = document.getElementById('cover');
			var bgEl = document.getElementById('bg');
			if (!open || !UUID.test(id)) return;

			var href = 'https://suno.com/song/' + id.toLowerCase();
			open.href = href;
			open.setAttribute('aria-label', 'Open on Suno');
			document.title = 'Open on Suno';

			function setTitle(title) {
				if (!title) return;
				titleEl.textContent = title;
				document.title = title;
				open.setAttribute('aria-label', 'Open ' + title + ' on Suno');
			}

			function setCover(url) {
				if (!url || !/^https?:\/\//i.test(url)) return;
				coverEl.src = url;
				coverEl.hidden = false;
				bgEl.src = url;
				bgEl.hidden = false;
			}

			var qTitle = String(params.get('t') || '').trim();
			var qImg = String(params.get('img') || '').trim();
			setTitle(qTitle);
			setCover(qImg);

			fetch('/api/suno/resolve?url=' + encodeURIComponent(href), {
				credentials: 'include',
				headers: { Accept: 'application/json' }
			})
				.then(function (res) {
					return res.ok ? res.json() : null;
				})
				.then(function (data) {
					if (!data) return;
					setTitle(typeof data.title === 'string' ? data.title.trim() : '');
					setCover(typeof data.ogImage === 'string' ? data.ogImage.trim() : '');
				})
				.catch(function () {});
		})();
	</script>
</body>
</html>
