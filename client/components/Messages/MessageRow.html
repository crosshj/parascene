<template id="row"><div class="connect-chat-msg"><div class="connect-chat-msg-inner"><div class="connect-chat-msg-bubble"></div></div></div></template>
<template id="meta"><div class="connect-chat-msg-meta"><span class="connect-chat-msg-meta-text"><span class="comment-author-name"></span></span></div></template>
<template id="separator"><span class="connect-chat-msg-meta-sep"> · </span></template>
<template id="when"><span class="connect-chat-msg-meta-when"></span></template>
<template id="toolbar"><div class="connect-chat-msg-hover-bar" role="toolbar" aria-label="Message actions"><div class="connect-chat-msg-hover-bar-quick"></div><span class="connect-chat-msg-hover-sep" aria-hidden="true"></span><div class="connect-chat-msg-hover-actions"></div></div></template>
<template id="quick-reaction"><button type="button" class="connect-chat-msg-hover-react"></button></template>
<template id="add-reaction"><button type="button" class="connect-chat-msg-hover-add-react" aria-label="Add reaction"></button></template>
<template id="reply"><button type="button" class="connect-chat-msg-hover-reply" data-chat-hover-reply="1" aria-label="Reply"></button></template>
<template id="copy"><button type="button" class="connect-chat-msg-hover-copy" data-chat-hover-copy="1" aria-label="Copy message text"></button></template>
<template id="edit"><button type="button" class="connect-chat-msg-hover-edit" data-chat-hover-edit="1"></button></template>
<template id="pin"><button type="button" class="connect-chat-msg-hover-pin" data-chat-hover-pin="1"></button></template>
<template id="delete"><button type="button" class="connect-chat-msg-hover-delete" data-chat-hover-delete="1"></button></template>
<template id="footer"><div class="connect-chat-msg-footer"></div></template>
