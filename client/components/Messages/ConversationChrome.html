<template id="canvas"><div class="chat-page-canvas-default-shell" data-chat-canvas-default-shell>
								<div class="chat-page-canvas-panel-body">
									<div class="chat-page-canvas-panel-head">
										<div class="chat-page-canvas-panel-title-row">
											<h2 class="chat-page-canvas-panel-title" data-chat-canvas-title-view></h2>
											<input type="text" class="chat-page-canvas-panel-title-input"
												data-chat-canvas-title-input hidden maxlength="200"
												aria-label="Canvas title" />
											<div class="chat-page-canvas-panel-head-actions">
												<div class="chat-page-canvas-more-wrap" data-chat-canvas-more-wrap
													hidden>
													<button type="button"
														class="feed-card-action feed-card-action-more chat-page-canvas-more-btn"
														data-chat-canvas-more aria-label="Canvas options"
														aria-expanded="false">
														<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
															<circle cx="12" cy="5" r="1.6"></circle>
															<circle cx="12" cy="12" r="1.6"></circle>
															<circle cx="12" cy="19" r="1.6"></circle>
														</svg>
													</button>
													<div class="feed-card-menu chat-page-canvas-owner-menu"
														data-chat-canvas-owner-menu style="display: none;" role="menu">
														<button type="button" class="feed-card-menu-item"
															data-chat-canvas-edit role="menuitem">Edit</button>
														<button type="button" class="feed-card-menu-item"
															data-chat-canvas-pin role="menuitem" hidden>Pin
															to channel</button>
														<button type="button" class="feed-card-menu-item"
															data-chat-canvas-unpin role="menuitem" hidden>Remove
															channel pin</button>
													</div>
												</div>
												<button type="button" class="modal-dismiss chat-page-canvas-close"
													data-chat-canvas-close aria-label="Close canvas"><svg class="modal-dismiss-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
											</div>
										</div>
									</div>
									<div class="chat-page-canvas-panel-scroll">
										<div class="chat-page-canvas-body user-text" data-chat-canvas-body-view></div>
										<textarea class="chat-page-canvas-body-input" data-chat-canvas-body-input hidden
											maxlength="4000" aria-label="Canvas body" rows="3"></textarea>
									</div>
								</div>
								<div class="chat-page-canvas-edit-footer" data-chat-canvas-edit-footer hidden>
									<div class="chat-page-canvas-edit-footer-left">
										<button type="button" class="btn-outlined chat-page-canvas-delete-btn"
											data-chat-canvas-delete>Delete</button>
									</div>
									<p class="chat-page-canvas-limit-hint" data-chat-canvas-limit-hint hidden></p>
									<div class="chat-page-canvas-edit-footer-right">
										<button type="button" class="chat-page-canvas-cancel-btn"
											data-chat-canvas-cancel>Cancel</button>
										<button type="button" class="btn-secondary chat-page-canvas-save-btn"
											data-chat-canvas-save>Save</button>
									</div>
								</div>
							</div>
</template>
<template id="history"><dialog class="creation-detail-dialog share-audio-modal" data-chat-history-copy-modal
		aria-labelledby="chat-history-copy-modal-title">
		<h2 id="chat-history-copy-modal-title" class="dialog-title">Copy chat history</h2>
		<button class="modal-close" type="button" aria-label="Close" data-chat-history-copy-close-btn>
			<svg class="modal-close-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
				stroke-linecap="round" stroke-linejoin="round">
				<line x1="18" y1="6" x2="6" y2="18"></line>
				<line x1="6" y1="6" x2="18" y2="18"></line>
			</svg>
		</button>
		<div class="share-audio-modal-content">
			<div class="share-audio-modal-stage">
				<div class="share-audio-panel share-audio-progress-panel is-active"
					data-chat-history-copy-panel="progress">
					<div class="share-audio-progress-wrap">
						<div class="share-audio-progress-track" aria-hidden="true">
							<div class="share-audio-progress-bar chat-history-copy-progress-bar"
								data-chat-history-copy-progress-bar></div>
						</div>
						<p class="share-audio-progress-label" data-chat-history-copy-progress-label role="status"
							aria-live="polite">Loading chat history…</p>
					</div>
				</div>
				<div class="share-audio-panel share-audio-ready-panel" data-chat-history-copy-panel="ready">
					<p class="share-audio-prompt">Chat history is ready. Copy the full thread as plain text.</p>
				</div>
			</div>
			<p class="share-audio-error" data-chat-history-copy-error role="alert"></p>
		</div>
		<div class="share-audio-modal-actions">
			<button type="button" class="btn-primary share-audio-copy-btn" data-chat-history-copy-btn hidden>Copy
				text</button>
		</div>
	</dialog></template>
<template id="create"><dialog class="chat-canvas-create-dialog"><form method="dialog"><h2>Create canvas</h2><input class="chat-canvas-create-title" maxlength="200" placeholder="Canvas title" aria-label="Canvas title" required><textarea class="chat-canvas-create-body" maxlength="4000" rows="10" placeholder="Canvas body" aria-label="Canvas body" required></textarea><p class="chat-canvas-create-limit-hint"></p><p role="alert" hidden></p><div class="chat-canvas-create-actions"><button type="button" data-cancel class="btn-secondary">Cancel</button><button type="submit" class="btn-primary">Create</button></div></form></dialog></template>
<template id="members"><dialog class="modal chat-private-members-dialog"><div class="chat-private-members-head"><h2>Members</h2><button type="button" data-cancel aria-label="Close">×</button></div><div class="chat-private-members-body"><p role="status">Loading members…</p><table class="chat-private-members-table" hidden><thead><tr><th scope="col">User</th><th scope="col">Status</th></tr></thead><tbody></tbody></table></div></dialog></template>
