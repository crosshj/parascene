# Production apex is an alias only. Keep every path and query on canonical www.
server {
	listen 80;
	server_name parascene.com;
	return 301 https://www.parascene.com$request_uri;
}

server {
	listen 443 ssl;
	server_name parascene.com;

	ssl_certificate /etc/letsencrypt/live/parascene.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/parascene.com/privkey.pem;

	return 301 https://www.parascene.com$request_uri;
}
