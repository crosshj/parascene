server {
	listen 80;
	server_name __SERVER_NAMES__;

	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	server_name __SERVER_NAMES__;

	ssl_certificate /etc/letsencrypt/live/parascene.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/parascene.com/privkey.pem;

	# Leave a small transport margin so the application owns the exact 50 MiB
	# policy and can return its structured error response.
	client_max_body_size 51m;
	proxy_request_buffering off;

	# Worker handlers hold the request until the job finishes. Vercel allowed 300s.
	location /api/worker/ {
		proxy_pass http://127.0.0.1:__HOST_PORT__;
		proxy_http_version 1.1;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
	}

	location = /api/try/worker {
		proxy_pass http://127.0.0.1:__HOST_PORT__;
		proxy_http_version 1.1;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
	}

	location / {
		proxy_pass http://127.0.0.1:__HOST_PORT__;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
	}
}
