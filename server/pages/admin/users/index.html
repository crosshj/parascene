<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Admin · Users</title>
	<link rel="stylesheet" href="/admin/shared/admin.css">
	<script type="module" src="/admin/users/page.js"></script>
</head>
<body class="admin-page admin-page--users">
	{{ADMIN_HEADER}}
	<main class="admin-page__content">
		<admin-tabs class="admin-tabs" sync-hash active="active">
			<div class="admin-tabs__list" data-admin-tab-list aria-label="User sections">
				<button class="admin-tabs__tab" data-admin-tab="active">Active</button>
				<button class="admin-tabs__tab" data-admin-tab="other">Other</button>
				<button class="admin-tabs__tab" data-admin-tab="tips">Tips</button>
				<button class="admin-tabs__tab" data-admin-tab="settings">Settings</button>
			</div>
			<section class="admin-tabs__panel" data-admin-panel="active">
				<div class="admin-user-export">
					<button class="admin-button" type="button" data-active-export-copy>Copy active users</button>
					<p class="admin-status" data-active-export-status role="status" aria-live="polite"></p>
				</div>
				<div data-active-users data-admin-table></div>
			</section>
			<section class="admin-tabs__panel" data-admin-panel="other" hidden>
				<div data-other-users data-admin-table></div>
			</section>
			<section class="admin-tabs__panel" data-admin-panel="tips" hidden>
				<div data-tips-table data-admin-table></div>
			</section>
			<section class="admin-tabs__panel" data-admin-panel="settings" hidden>
				<div class="admin-table-wrap">
					<table class="admin-table admin-user-settings-table" aria-label="User settings">
						<thead><tr><th scope="col">Setting</th><th scope="col">Value</th></tr></thead>
						<tbody><tr class="admin-table__interactive-row" data-tip-setting-row tabindex="0" role="button" aria-label="Edit minimum days before tipping">
							<th scope="row">Minimum days before tipping</th><td data-tip-setting-value>Loading…</td>
						</tr></tbody>
					</table>
				</div>
				<p class="admin-status" data-settings-table-status role="status" aria-live="polite"></p>
			</section>
		</admin-tabs>
	</main>
	<dialog class="admin-dialog" data-user-dialog aria-labelledby="admin-user-title">
		<header class="admin-dialog__header">
			<h2 id="admin-user-title">User</h2>
			<button class="admin-button" type="button" data-user-close aria-label="Close">Close</button>
		</header>
		<div class="admin-dialog__body">
			<dl class="admin-user-details" data-user-details></dl>
			<p class="admin-status" data-user-status role="status" aria-live="polite"></p>
		</div>
		<footer class="admin-dialog__actions admin-user-actions">
			<button class="admin-button" type="button" data-user-tip>Tip</button>
			<button class="admin-button" type="button" data-user-suspend>Suspend</button>
			<button class="admin-button" type="button" data-user-founder>Grant founder</button>
			<button class="admin-button admin-button--danger" type="button" data-user-delete>Delete</button>
			<a class="admin-button admin-button--primary" data-user-profile target="_blank" rel="noopener">View profile</a>
		</footer>
	</dialog>
	<dialog class="admin-dialog" data-user-action-dialog aria-labelledby="admin-user-action-title">
		<header class="admin-dialog__header">
			<h2 id="admin-user-action-title"></h2>
			<button class="admin-button" type="button" data-action-close aria-label="Close">Close</button>
		</header>
		<form class="admin-dialog__body admin-form" data-user-action-form>
			<p data-action-description></p>
			<div data-action-fields></div>
			<p class="admin-status admin-status--error" data-action-error role="alert" hidden></p>
			<footer class="admin-dialog__actions">
				<button class="admin-button" type="button" data-action-cancel>Cancel</button>
				<button class="admin-button admin-button--primary" type="submit" data-action-submit>Confirm</button>
			</footer>
		</form>
	</dialog>
	<dialog class="admin-dialog" data-settings-dialog aria-labelledby="admin-settings-title">
		<header class="admin-dialog__header">
			<h2 id="admin-settings-title">Minimum days before tipping</h2>
			<button class="admin-button" type="button" data-settings-close aria-label="Close">Close</button>
		</header>
		<form class="admin-dialog__body admin-form" data-users-settings>
			<div class="admin-field">
				<label class="admin-field__label" for="min-days-before-tip">Minimum days before tipping</label>
				<input class="admin-input" id="min-days-before-tip" name="min_days_before_tip" type="number" min="0" step="1" required>
				<p class="admin-field__help">Free accounts must have been present this many days before they can tip. Upgraded accounts are exempt.</p>
			</div>
			<p class="admin-status" data-settings-status role="status" aria-live="polite"></p>
			<footer class="admin-dialog__actions">
				<button class="admin-button" type="button" data-settings-cancel>Cancel</button>
				<button class="admin-button admin-button--primary" type="submit" data-settings-save>Save setting</button>
			</footer>
		</form>
	</dialog>
	<dialog class="admin-dialog" data-tip-dialog aria-labelledby="admin-tip-title">
		<header class="admin-dialog__header">
			<h2 id="admin-tip-title">Tip details</h2>
			<button class="admin-button" type="button" data-tip-close aria-label="Close">Close</button>
		</header>
		<div class="admin-dialog__body">
			<dl class="admin-user-details" data-tip-details></dl>
			<p class="admin-status" data-tip-message></p>
		</div>
	</dialog>
</body>
</html>
