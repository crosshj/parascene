<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Admin · Algo</title>
	<link rel="stylesheet" href="/admin/shared/admin.css">
</head>
<body class="admin-page">
	{{ADMIN_HEADER}}
	<main class="admin-page__content"><admin-tabs class="admin-tabs" sync-hash active="transitions"><div class="admin-tabs__list" data-admin-tab-list aria-label="Algorithm sections"><button class="admin-tabs__tab" data-admin-tab="transitions">Click-next</button><button class="admin-tabs__tab" data-admin-tab="graph">Graph</button><button class="admin-tabs__tab" data-admin-tab="feed-pins">Feed pins</button><button class="admin-tabs__tab" data-admin-tab="settings">Settings</button></div><section class="admin-tabs__panel" data-admin-panel="transitions"><div data-transitions-table data-admin-table></div></section><section class="admin-tabs__panel" data-admin-panel="graph" hidden><div data-transition-graph></div></section><section class="admin-tabs__panel" data-admin-panel="feed-pins" hidden><div data-feed-pins><div class="admin-section-heading"><h2>Configured pins</h2><div class="admin-actions"><button class="admin-button" type="button" data-clear-expired-pins>Clear expired</button><button class="admin-button" type="button" data-open-pin-defaults>Defaults</button><button class="admin-button admin-button--primary" type="button" data-add-pin>Add pin</button></div></div><p class="admin-detail">Inject published creations into page one of the feed. Select a row to view or edit its settings.</p><div data-pins-table data-admin-table></div><p class="admin-status" data-pins-status role="status"></p></div></section><section class="admin-tabs__panel" data-admin-panel="settings" hidden><form class="admin-form" data-algo-settings><div data-algo-fields></div><button class="admin-button admin-button--primary" type="submit">Save settings</button><p class="admin-status" data-algo-status role="status"></p></form></section></admin-tabs></main>
	<dialog class="admin-dialog" data-transition-dialog><header class="admin-dialog__header"><h2 data-transition-dialog-title>Transition details</h2><button class="admin-button" type="button" data-transition-dialog-close>Close</button></header><div class="admin-dialog__body" data-transition-dialog-body></div></dialog>
	<dialog class="admin-dialog" data-pin-dialog aria-labelledby="pin-dialog-title"><header class="admin-dialog__header"><h2 id="pin-dialog-title" data-pin-dialog-title>Feed pin</h2><button class="admin-button" type="button" data-pin-dialog-close>Close</button></header><div class="admin-dialog__body" data-pin-dialog-body></div><footer class="admin-dialog__actions"><button class="admin-button admin-button--danger" type="button" data-pin-remove>Remove</button><button class="admin-button admin-button--primary" type="button" data-pin-save>Save pin</button></footer></dialog>
	<dialog class="admin-dialog" data-pin-defaults-dialog aria-labelledby="pin-defaults-title"><header class="admin-dialog__header"><h2 id="pin-defaults-title">Feed pin defaults</h2><button class="admin-button" type="button" data-pin-defaults-close>Close</button></header><div class="admin-dialog__body" data-pin-defaults-body></div><footer class="admin-dialog__actions"><button class="admin-button admin-button--primary" type="button" data-pin-defaults-save>Save defaults</button></footer></dialog>
	<dialog class="admin-dialog" data-clear-expired-dialog aria-labelledby="clear-expired-title"><header class="admin-dialog__header"><h2 id="clear-expired-title">Expired feed pins</h2><button class="admin-button" type="button" data-clear-expired-close>Close</button></header><div class="admin-dialog__body"><p>These pins have passed their expiry date and can be removed.</p><div data-expired-pin-list></div><p class="admin-status" data-expired-pin-status role="status" aria-live="polite"></p></div><footer class="admin-dialog__actions"><button class="admin-button admin-button--primary admin-clear-expired-submit" type="button" data-clear-expired-submit><span data-clear-expired-label>Remove expired pins</span><span class="admin-spinner" data-clear-expired-spinner aria-hidden="true" hidden></span></button></footer></dialog>
	<script type="module" src="/admin/algo/page.js"></script>
</body>
</html>
