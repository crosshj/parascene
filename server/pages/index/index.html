<!doctype html>
<html lang="en">
	<head>
		<script src="/brand/logo-env.js"></script>
		<link rel="stylesheet" href="/brand/logo-prscn.css" />
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta
			name="color-scheme"
			content="light dark"
		/>
		<meta
			name="description"
			content="Parascene — a community for creating and sharing with generative tools."
		/>
		<meta
			name="theme-color"
			content="#f6f7fb"
			media="(prefers-color-scheme: light)"
		/>
		<meta
			name="theme-color"
			content="#1a1628"
			media="(prefers-color-scheme: dark)"
		/>
		<link
			rel="manifest"
			href="/manifest.webmanifest"
		/>
		<link
			rel="apple-touch-icon"
			href="/icons/icon-180.png"
		/>
		<link
			rel="icon"
			href="/favicon.svg"
			type="image/svg+xml"
		/>
		<link
			rel="stylesheet"
			href="/typography.css"
		/>
		<title>parascene</title>
		{{CANONICAL_LINK}}
		<style>
			:root {
				color-scheme: light dark;
				--bg: #f6f7fb;
				--text: #0f172a;
				--text-muted: #525a6b;
				--accent: #7c3aed;
				--accent-text: #ffffff;
				--vl-video-bg: #d6d3e6;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0f0d1a;
					--text: #ede9fe;
					--text-muted: #9ca3af;
					--accent: #05c76f;
					--accent-text: #0f0d1a;
					--vl-video-bg: #1b152e;
				}
			}

			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			html {
				background: var(--bg);
			}

			body.vl-page {
				margin: 0;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				font-family: var(--font-family);
				background: var(--bg);
				color: var(--text);
				-webkit-font-smoothing: antialiased;
			}

			main {
				flex: 1;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				padding: 20px;
			}

			.vl-shell {
				width: 100%;
				max-width: 750px;
				text-align: center;
			}

			.vl-hero {
				display: flex;
				flex-direction: column;
				align-items: center;
				width: 100%;
			}

			.vl-intro {
				align-self: stretch;
				width: 100%;
			}

			html.vl-reveal .vl-logo,
			html.vl-reveal .vl-tagline,
			html.vl-reveal .vl-subline {
				opacity: 0;
			}

			html.vl-reveal.is-in .vl-logo {
				animation: vl-intro-in 700ms cubic-bezier(0.16, 1, 0.3, 1) 120ms both;
			}

			html.vl-reveal.is-in .vl-tagline,
			html.vl-reveal.is-in .vl-subline {
				animation: vl-intro-in 700ms cubic-bezier(0.16, 1, 0.3, 1) 240ms both;
			}

			@keyframes vl-intro-in {
				from {
					opacity: 0;
					transform: translateY(6px);
				}

				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			.vl-logo {
				display: block;
				line-height: 0;
				text-decoration: none;
			}

			.vl-logo svg {
				display: block;
				width: 240px;
				height: auto;
				margin: 0 auto;
			}

			.vl-logo .logo-text {
				fill: var(--text);
			}

			.vl-logo.is-glow .logo-text {
				animation: vl-logo-pulse 900ms ease-in-out forwards;
			}

			@keyframes vl-logo-pulse {
				0% {
					opacity: 1;
				}

				22% {
					opacity: 0.15;
				}

				48% {
					opacity: 1;
				}

				70% {
					opacity: 0.4;
				}

				100% {
					opacity: 1;
				}
			}

			.vl-tagline {
				align-self: stretch;
				margin: 4px 0 0;
				padding: 0 24px;
				min-width: 0;
				font-size: 1.125rem;
				font-weight: 500;
				line-height: 1.35;
				text-align: center;
				color: var(--text);
			}

			.vl-subline {
				align-self: stretch;
				margin: 6px 0 0;
				padding: 0 24px;
				min-width: 0;
				font-size: 0.9rem;
				font-weight: 400;
				line-height: 1.3;
				text-align: center;
				color: var(--text-muted);
			}

			.vl-video {
				margin-top: 30px;
				position: relative;
				width: 100%;
				aspect-ratio: 16 / 9;
				border-radius: 10px;
				overflow: hidden;
				background: var(--vl-video-bg);
				cursor: pointer;
			}

			.vl-video-poster,
			.vl-video-media,
			.vl-video-overlay {
				position: absolute;
			}

			.vl-video-poster,
			.vl-video-overlay {
				inset: 0;
				width: 100%;
				height: 100%;
			}

			.vl-video-poster {
				object-fit: cover;
				object-position: center;
				transform: scale(1.06);
				opacity: 0;
				animation: vl-poster-drift 24s ease-in-out infinite alternate;
				transition: opacity 0.7s ease;
			}

			.vl-video-poster.is-shown {
				opacity: 1;
			}

			.vl-video.has-started .vl-video-poster {
				opacity: 0;
				pointer-events: none;
				animation: none;
			}

			@keyframes vl-poster-drift {
				from {
					transform: scale(1.06) translate(0, 0);
				}

				to {
					transform: scale(1.14) translate(-1.4%, 1.2%);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				html.vl-reveal .vl-logo,
				html.vl-reveal .vl-tagline,
				html.vl-reveal .vl-subline {
					opacity: 1;
					animation: none;
					transform: none;
				}

				.vl-logo.is-glow .logo-text {
					animation: none;
					opacity: 1;
				}

				.vl-video-poster {
					animation: none;
					transform: none;
				}

				.vl-video-play.is-attention::before {
					animation: none;
				}
			}

			.vl-video-media {
				top: 50%;
				left: 50%;
				width: auto;
				height: 100%;
				min-width: 100%;
				max-width: none;
				transform: translate(-50%, -50%);
				object-fit: cover;
				object-position: center;
				opacity: 0;
				transition: opacity 0.25s ease;
			}

			.vl-video.is-playing .vl-video-media,
			.vl-video.has-started .vl-video-media {
				opacity: 1;
			}

			.vl-video-overlay {
				display: grid;
				place-items: center;
				background: rgba(0, 0, 0, 0.22);
				transition:
					opacity 0.25s ease,
					background 0.25s ease;
			}

			.vl-video.is-playing .vl-video-overlay {
				opacity: 0;
				pointer-events: none;
			}

			@media (hover: hover) and (pointer: fine) {
				.vl-video.is-playing:hover .vl-video-overlay {
					opacity: 1;
					pointer-events: auto;
					background: rgba(0, 0, 0, 0.2);
				}
			}

			.vl-video-play {
				position: relative;
				display: grid;
				place-items: center;
				width: 56px;
				height: 56px;
				padding: 0;
				border: none;
				border-radius: 50%;
				overflow: hidden;
				cursor: pointer;
				color: #fff;
				background: rgba(139, 92, 246, 0.42);
				backdrop-filter: blur(10px);
				-webkit-backdrop-filter: blur(10px);
				box-shadow: 0 2px 16px rgba(124, 58, 237, 0.25);
				transition:
					background 0.2s ease,
					transform 0.2s ease,
					box-shadow 0.2s ease;
				-webkit-tap-highlight-color: transparent;
			}

			@keyframes vl-play-shimmer {
				0% {
					transform: translateX(-160%);
					opacity: 0;
				}

				16% {
					opacity: 1;
				}

				100% {
					transform: translateX(160%);
					opacity: 0;
				}
			}

			.vl-video-play::before {
				content: '';
				position: absolute;
				inset: 0;
				border-radius: inherit;
				background: linear-gradient(
					115deg,
					transparent 28%,
					rgba(255, 255, 255, 0.2) 42%,
					rgba(255, 255, 255, 0.9) 50%,
					rgba(255, 255, 255, 0.2) 58%,
					transparent 72%
				);
				transform: translateX(-160%);
				opacity: 0;
				pointer-events: none;
			}

			.vl-video-play.is-attention::before {
				animation: vl-play-shimmer 0.9s ease-out forwards;
			}

			.vl-video-play:focus,
			.vl-video-play:focus-visible {
				outline: none;
			}

			.vl-video:hover .vl-video-play {
				background: rgba(167, 139, 250, 0.55);
				box-shadow: 0 4px 20px rgba(124, 58, 237, 0.35);
				transform: scale(1.04);
			}

			@media (prefers-color-scheme: dark) {
				.vl-video-play {
					background: rgba(167, 139, 250, 0.38);
					box-shadow: 0 2px 16px rgba(139, 92, 246, 0.3);
				}

				.vl-video:hover .vl-video-play {
					background: rgba(196, 181, 253, 0.52);
					box-shadow: 0 4px 20px rgba(167, 139, 250, 0.4);
				}
			}

			.vl-video-play svg {
				position: relative;
				z-index: 1;
				width: 22px;
				height: 22px;
			}

			.vl-icon-play {
				margin-left: 2px;
			}

			.vl-icon-pause {
				display: none;
			}

			.vl-video.is-playing .vl-icon-play {
				display: none;
			}

			.vl-video.is-playing .vl-icon-pause {
				display: block;
			}

			.vl-cta-row {
				--vl-cta-1: #5b329a;
				--vl-cta-2: #ab3eff;
				--vl-cta-3: #e9e3ff;
				--vl-cta-bg: linear-gradient(
					155deg,
					var(--vl-cta-1) 50%,
					var(--vl-cta-2) 80%,
					var(--vl-cta-3) 100%
				);
				--vl-cta-accent: #ce4cff;
				--vl-cta-text: color-mix(in srgb, #ffffff 90%, var(--vl-cta-1));
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 10px;
				width: 100%;
				margin-top: 36px;
			}

			@media (prefers-color-scheme: dark) {
				.vl-cta-row {
					--vl-cta-1: #0a6464;
					--vl-cta-2: #00b4a0;
					--vl-cta-3: #00c8b4;
					--vl-cta-accent: rgba(0, 200, 180, 0.5);
				}
			}

			@keyframes vl-cta-shimmer {
				0% {
					transform: translateX(-140%);
					opacity: 0;
				}

				18% {
					opacity: 1;
				}

				100% {
					transform: translateX(140%);
					opacity: 0;
				}
			}

			.vl-cta {
				position: relative;
				display: inline-block;
				padding: 14px 32px;
				font-size: 1.05rem;
				font-weight: 400;
				letter-spacing: 0.16em;
				color: var(--vl-cta-text);
				text-decoration: none;
				border-radius: 36px;
				corner-shape: squircle;
				background: var(--vl-cta-bg);
				border: 0.25px solid var(--vl-cta-accent);
				box-shadow: 0 4px 20px
					color-mix(in srgb, var(--vl-cta-2) 35%, transparent);
				transition:
					transform 0.2s ease,
					filter 0.2s ease;
				overflow: hidden;
			}

			.vl-cta::before {
				content: '';
				position: absolute;
				inset: 0;
				border-radius: inherit;
				corner-shape: inherit;
				background: linear-gradient(
					105deg,
					transparent 8%,
					rgba(255, 255, 255, 0.16) 24%,
					rgba(255, 255, 255, 0.55) 50%,
					rgba(255, 255, 255, 0.16) 76%,
					transparent 92%
				);
				transform: translateX(-140%);
				opacity: 0;
				pointer-events: none;
			}

			.vl-cta.is-attention::before {
				animation: vl-cta-shimmer 0.75s ease-out forwards;
			}

			.vl-cta:hover {
				transform: translateY(-1px);
				filter: brightness(1.06);
				color: var(--vl-cta-text);
			}

			.vl-cta:focus-visible {
				outline: none;
				border-color: var(--vl-cta-accent);
			}

			.vl-footer {
				flex-shrink: 0;
				padding: 20px;
				text-align: center;
				font-size: 0.75rem;
				color: var(--text-muted);
			}

			.vl-footer a {
				color: inherit;
				text-decoration: none;
			}

			.vl-footer a:hover {
				color: var(--text);
				text-decoration: underline;
			}

			@media (max-width: 768px) {
				html {
					overflow: hidden;
					max-width: 100%;
					overscroll-behavior-x: none;
				}

				body.vl-page {
					overflow: hidden;
					height: 100dvh;
					max-height: 100dvh;
					min-height: 0;
					overscroll-behavior-x: none;
				}

				main {
					flex: 1 1 auto;
					min-height: 0;
					overflow: hidden;
					justify-content: flex-start;
					padding: 0;
					width: 100%;
					max-width: 100%;
				}

				.vl-shell,
				.vl-hero {
					width: 100%;
					max-width: 100%;
					overflow-x: clip;
					min-height: 0;
				}

				.vl-hero {
					--vl-frame: min(52dvh, calc(100vw * 9 / 16));
				}

				.vl-intro {
					display: flex;
					flex-direction: column;
					align-items: center;
					justify-content: center;
					flex-shrink: 0;
					height: var(--vl-frame);
				}

				.vl-logo,
				.vl-tagline,
				.vl-subline,
				.vl-cta-row {
					padding-left: 20px;
					padding-right: 20px;
				}

				.vl-tagline {
					margin-top: 4px;
					/* Shrink with the screen so the sentence stays one line. */
					font-size: clamp(0.62rem, calc((100vw - 40px) / 29), 1rem);
				}

				.vl-subline {
					margin-top: 4px;
					font-size: clamp(0.55rem, calc((100vw - 40px) / 34), 0.8rem);
				}

				.vl-logo svg {
					width: min(255px, calc(100vw - 48px));
					padding-bottom: 0.5em;
				}

				.vl-video {
					width: 150vw;
					max-width: none;
					max-height: min(52dvh, calc(150vw * 9 / 16));
					margin-top: 0;
					border-radius: 0;
					flex-shrink: 1;
				}

				/* Opt out of the 150vw bleed so the whole frame stays on screen. */
				.vl-video.vl-video-contained {
					width: 100%;
					max-width: 100%;
					max-height: var(--vl-frame);
				}

				.vl-cta-row {
					margin-top: calc(var(--vl-frame) * 0.22);
					flex-shrink: 0;
				}

				.vl-footer {
					flex-shrink: 0;
					padding-top: 14px;
					padding-bottom: 14px;
				}
			}
		</style>
		<script>
			(function () {
				document.documentElement.classList.add('vl-reveal');
				if (
					window.matchMedia &&
					window.matchMedia('(prefers-reduced-motion: reduce)').matches
				)
					return;
				var started = false;
				function start() {
					if (started) return;
					started = true;
					document.documentElement.classList.add('is-in');
				}
				var cap = setTimeout(start, 300);
				if (document.fonts && document.fonts.ready) {
					document.fonts.ready.then(function () {
						clearTimeout(cap);
						start();
					});
				}
			})();
		</script>
	</head>

		<script>
			(function () {
				var frame = document.querySelector('.vl-video');
				if (!frame) return;
				var video = frame.querySelector('video');
				var playBtn = frame.querySelector('.vl-video-play');
				if (!video) return;

				var splashSrc = '/assets/splash.mp4';
				var loadPromise = null;
				var cta = document.querySelector('.vl-cta');
				var ctaAttentionPlayed = false;
				var logo = document.querySelector('.vl-logo');
				var logoCue = 26.6;
				var logoShimmerPlayed = false;
				var lastVideoTime = 0;
				var videoFinished = false;
				var landingVariant = 'video';
				var trackedPlay = false;
				var trackedComplete = false;
				var idleHints = true;
				var playShimmerTimer = null;
				var posterTimer = null;
				var posters = (frame.getAttribute('data-posters') || '')
					.split(',')
					.filter(Boolean);
				var posterIndex = 0;
				var posterLayers = frame.querySelectorAll('.vl-video-poster');
				var shownPoster =
					frame.querySelector('.vl-video-poster.is-shown') || posterLayers[0];
				if (shownPoster && shownPoster.dataset.posterIndex) {
					posterIndex = parseInt(shownPoster.dataset.posterIndex, 10) || 0;
				}

				function reduceMotion() {
					return (
						window.matchMedia &&
						window.matchMedia('(prefers-reduced-motion: reduce)').matches
					);
				}

				function stopIdleHints() {
					if (!idleHints) return;
					idleHints = false;
					clearTimeout(playShimmerTimer);
					clearTimeout(posterTimer);
					if (playBtn) playBtn.classList.remove('is-attention');
				}

				function schedulePlayShimmer(delay) {
					if (!idleHints || !playBtn || reduceMotion()) return;
					playShimmerTimer = setTimeout(function () {
						if (!idleHints || !playBtn) return;
						playBtn.classList.add('is-attention');
						function onShimmerEnd(e) {
							if (e.animationName !== 'vl-play-shimmer') return;
							playBtn.removeEventListener('animationend', onShimmerEnd);
							playBtn.classList.remove('is-attention');
							schedulePlayShimmer(4800);
						}
						playBtn.addEventListener('animationend', onShimmerEnd);
					}, delay);
				}

				function schedulePosterSwap(delay) {
					if (!idleHints || posters.length < 2 || posterLayers.length < 2)
						return;
					posterTimer = setTimeout(function () {
						if (!idleHints) return;
						posterIndex = (posterIndex + 1) % posters.length;
						var incoming =
							posterLayers[0] === shownPoster
								? posterLayers[1]
								: posterLayers[0];
						var revealed = false;
						function reveal() {
							incoming.removeEventListener('load', reveal);
							if (revealed || !idleHints) return;
							revealed = true;
							incoming.classList.add('is-shown');
							if (shownPoster) shownPoster.classList.remove('is-shown');
							shownPoster = incoming;
							schedulePosterSwap(7500);
						}
						incoming.addEventListener('load', reveal);
						incoming.src = posters[posterIndex];
						if (
							incoming.complete &&
							incoming.getAttribute('src') === posters[posterIndex]
						)
							reveal();
					}, delay);
				}

				posters.forEach(function (src) {
					var preload = new Image();
					preload.src = src;
				});

				function startIdleHints() {
					idleHints = true;
					schedulePlayShimmer(1400);
					schedulePosterSwap(7500);
				}

				startIdleHints();

				function playCtaAttention() {
					if (ctaAttentionPlayed || !cta) return;
					ctaAttentionPlayed = true;

					var shimmerGaps = [550, 1200];
					var shimmerCount = 3;

					function runShimmer(index) {
						cta.classList.add('is-attention');
						function onShimmerEnd(e) {
							if (e.animationName !== 'vl-cta-shimmer') return;
							cta.removeEventListener('animationend', onShimmerEnd);
							cta.classList.remove('is-attention');
							if (index >= shimmerCount - 1) return;
							setTimeout(function () {
								void cta.offsetWidth;
								runShimmer(index + 1);
							}, shimmerGaps[index]);
						}
						cta.addEventListener('animationend', onShimmerEnd);
					}

					runShimmer(0);
				}

				function ensureVideoLoaded() {
					if (video.currentSrc) {
						if (video.readyState >= 2) return Promise.resolve();
						return new Promise(function (resolve) {
							video.addEventListener('loadeddata', function onReady() {
								video.removeEventListener('loadeddata', onReady);
								resolve();
							});
						});
					}
					if (loadPromise) return loadPromise;
					loadPromise = new Promise(function (resolve, reject) {
						function onReady() {
							cleanup();
							resolve();
						}
						function onError() {
							cleanup();
							loadPromise = null;
							reject(new Error('video load failed'));
						}
						function cleanup() {
							video.removeEventListener('loadeddata', onReady);
							video.removeEventListener('error', onError);
						}
						video.addEventListener('loadeddata', onReady);
						video.addEventListener('error', onError);
						video.src = splashSrc;
						video.load();
					});
					return loadPromise;
				}

				function pauseVideo() {
					video.pause();
					frame.classList.remove('is-playing');
					updateControlLabel();
				}

				function updateControlLabel() {
					if (!playBtn) return;
					playBtn.setAttribute(
						'aria-label',
						video.paused ? 'Play video' : 'Pause video'
					);
				}

				function playVideo() {
					stopIdleHints();
					if (!video.paused && frame.classList.contains('is-playing')) return;
					video.muted = false;
					ensureVideoLoaded()
						.then(function () {
							if (video.ended || videoFinished) {
								videoFinished = false;
								lastVideoTime = 0;
								logoShimmerPlayed = false;
								video.currentTime = 0;
							}
							frame.classList.add('is-playing', 'has-started');
							updateControlLabel();
							return video.play();
						})
						.then(function () {
							if (!trackedPlay) {
								trackedPlay = true;
							}
							armLogoCue();
						})
						.catch(function () {});
				}

				function toggleVideo() {
					if (!video.paused) pauseVideo();
					else playVideo();
				}

				if (playBtn) {
					playBtn.addEventListener('click', function (e) {
						e.stopPropagation();
						toggleVideo();
					});
				}
				frame.addEventListener('click', function (e) {
					if (e.target.closest('a')) return;
					toggleVideo();
				});

				function shimmerWordmark() {
					if (!logo || logoShimmerPlayed) return;
					logoShimmerPlayed = true;
					if (
						window.matchMedia &&
						window.matchMedia('(prefers-reduced-motion: reduce)').matches
					)
						return;
					logo.classList.remove('is-glow');
					void logo.offsetWidth;
					logo.classList.add('is-glow');
				}

				function considerLogoCue(now) {
					if (now < logoCue) logoShimmerPlayed = false;
					else if (!logoShimmerPlayed && lastVideoTime < logoCue)
						shimmerWordmark();
					lastVideoTime = now;
				}

				var logoCueWatch = false;
				function watchLogoCue() {
					logoCueWatch = false;
					if (video.paused || video.ended) return;
					considerLogoCue(video.currentTime);
					armLogoCue();
				}
				function armLogoCue() {
					if (logoCueWatch || !video.requestVideoFrameCallback) return;
					if (video.paused || video.ended) return;
					logoCueWatch = true;
					video.requestVideoFrameCallback(watchLogoCue);
				}

				video.addEventListener('timeupdate', function () {
					considerLogoCue(video.currentTime);
					armLogoCue();
				});

				video.addEventListener('ended', function () {
					videoFinished = true;
					frame.classList.remove('is-playing', 'has-started');
					try {
						video.currentTime = 0;
					} catch (e) {}
					lastVideoTime = 0;
					logoShimmerPlayed = false;
					updateControlLabel();
					startIdleHints();
					if (!trackedComplete) {
						trackedComplete = true;
					}
					playCtaAttention();
				});
				updateControlLabel();
			})();
		</script>
