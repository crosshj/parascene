<!doctype html>
<html lang="en">
	<head>
		<script src="/brand/logo-env.js"></script>
		<link rel="stylesheet" href="/brand/logo-prscn.css" />
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<script>
			document.documentElement.classList.add('app-sidebar-layout-pending');
			if (/^\/creations\/\d+\/?$/.test(location.pathname)) {
				document.documentElement.classList.add('app-overlay-route-pending');
			}
		</script>
		<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1a1628" media="(prefers-color-scheme: dark)" />
	<link rel="manifest" href="/manifest.webmanifest" />
	<link rel="apple-touch-icon" href="/icons/icon-180.png" />
		<link
			rel="icon"
			href="/favicon.svg"
			type="image/svg+xml"
		/>
		<link rel="stylesheet" href="/typography.css" />
		<style>
			:root {
				color-scheme: light dark;
				font-family: var(--font-family);
				--app-sidebar-width: 272px;
				--app-mobile-nav-height: 68px;
				--app-shell-inset: 6px;
				--app-panel-gap: 8px;
				--app-panel-radius: 20px;
				--app-canvas-background: #ffffff;
				--app-panel-background: #eef1f6;
			}
			body {
				margin: 0;
				min-height: 100vh;
				background: #f6f7fb;
				color: #0f172a;
			}
			body > header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				min-height: 72px;
				padding: 0 24px;
				border-bottom: 1px solid
					color-mix(in srgb, currentColor 15%, transparent);
			}
			.brand {
				display: inline-block;
				color: inherit;
				text-decoration: none;
			}
			.brand .logo {
				display: block;
				width: 150px;
				height: auto;
			}
			.brand .logo-text {
				font-family: var(--font-family);
				font-size: 36px;
				font-weight: 700;
				font-style: italic;
				fill: currentColor;
				letter-spacing: -0.02em;
			}
			.logo-sprite {
				position: absolute;
				width: 0;
				height: 0;
				overflow: hidden;
			}
			main {
				max-width: 720px;
				margin: 0 auto;
				padding: 72px 24px;
			}
			.card {
				padding: 32px;
				border: 1px solid color-mix(in srgb, currentColor 15%, transparent);
				border-radius: 20px;
				box-shadow: 0 18px 45px color-mix(in srgb, #0f172a 8%, transparent);
			}
			.eyebrow {
				margin: 0 0 14px;
				color: #7c3aed;
				font-size: 0.75rem;
				font-weight: 800;
				letter-spacing: 0.12em;
				text-transform: uppercase;
			}
			h1 {
				margin: 0;
				font-size: clamp(2rem, 5vw, 3.25rem);
				letter-spacing: -0.045em;
			}
			.state {
				margin: 18px 0 0;
				font-size: 1.05rem;
				line-height: 1.55;
			}
			.account {
				margin: 24px 0 0;
				padding-top: 20px;
				border-top: 1px solid color-mix(in srgb, currentColor 12%, transparent);
			}
			.actions {
				display: flex;
				flex-wrap: wrap;
				gap: 12px;
				align-items: center;
				margin-top: 28px;
			}
			.www-link {
				display: inline-flex;
				align-items: center;
				min-height: 44px;
				padding: 0 14px;
				border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
				border-radius: 999px;
				color: inherit;
				font-weight: 600;
				text-decoration: none;
			}
			#logout {
				min-height: 44px;
				padding: 0 16px;
				border: 0;
				border-radius: 999px;
				color: #fff;
				background: #7c3aed;
				font: inherit;
				font-weight: 700;
				cursor: pointer;
			}
			.route-note {
				margin-top: 28px;
				font-size: 0.8rem;
			}
			body.app-layout > header {
				display: none;
			}
			body.app-layout {
				height: 100vh;
				overflow: hidden;
				overscroll-behavior: none;
				background: var(--app-canvas-background);
			}
			body.app-layout #app-shell {
				height: 100vh;
				min-height: 100vh;
				overflow: hidden;
			}
			html.app-overlay-route-pending [data-layout-region] {
				visibility: hidden !important;
			}
			html.app-sidebar-layout-pending [data-layout-region="sidebar"],
			html.app-sidebar-layout-pending [data-layout-region="page"],
			html.app-sidebar-layout-pending [data-layout-region="mobile-navigation"] {
				visibility: hidden;
			}
			body.app-layout main#app-outlet {
				box-sizing: border-box;
				width: auto;
				max-width: none;
				min-width: 0;
				height: calc(100vh - var(--app-shell-inset) - var(--app-shell-inset));
				min-height: calc(100vh - var(--app-shell-inset) - var(--app-shell-inset));
				margin: var(--app-shell-inset) var(--app-shell-inset) var(--app-shell-inset) calc(var(--app-sidebar-width) + var(--app-shell-inset) + var(--app-panel-gap));
				padding: 0;
				overflow: hidden;
				overscroll-behavior: none;
				border-radius: var(--app-panel-radius);
				corner-shape: squircle;
				background: var(--app-panel-background);
			}
			.app-layout-placeholder-sidebar {
				position: fixed;
				inset: var(--app-shell-inset) auto var(--app-shell-inset) var(--app-shell-inset);
				box-sizing: border-box;
				width: var(--app-sidebar-width);
				overflow: hidden;
				border-radius: var(--app-panel-radius);
				corner-shape: squircle;
				background: var(--app-panel-background);
				z-index: 10;
			}
			.app-layout-placeholder-head {
				display: flex;
				flex-direction: row;
				align-items: center;
				justify-content: flex-start;
				gap: 0;
				box-sizing: border-box;
				min-height: 48px;
				height: 48px;
				padding: 0 10px;
			}
			.app-layout-placeholder-brand {
				display: inline-flex;
				align-items: center;
				margin: 0;
				padding: 0;
				color: inherit;
				text-decoration: none;
				line-height: 0;
			}
			.app-layout-placeholder-brand-mark {
				display: block;
				height: 40px;
				width: auto;
				max-width: 100%;
				margin-top: 5px;
				margin-left: 8px;
				fill: currentColor;
			}
			.app-layout-placeholder-mobile {
				display: none;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--app-canvas-background: #0e0d19;
					--app-panel-background: color-mix(in srgb, #191627 88%, #0e0d19);
				}
				body {
					background: #0e0d19;
					color: #ede9fe;
				}
			}
			@media (max-width: 760px) {
				body.app-layout main#app-outlet {
					height: calc(100vh - var(--app-mobile-nav-height) - var(--app-shell-inset) - var(--app-shell-inset));
					min-height: calc(100vh - var(--app-mobile-nav-height) - var(--app-shell-inset) - var(--app-shell-inset));
					margin: var(--app-shell-inset);
				}
				.app-layout-placeholder-sidebar {
					display: none;
				}
				.app-layout-placeholder-mobile {
					position: fixed;
					inset: auto 0 0;
					display: block;
					box-sizing: border-box;
					min-height: var(--app-mobile-nav-height);
					border-top: 1px solid color-mix(in srgb, currentColor 12%, transparent);
					background: color-mix(in srgb, Canvas 96%, currentColor 4%);
					z-index: 10;
				}
			}
		</style>
		<script>
			try {
				const storedSidebarWidth = Number(localStorage.getItem('prsn-chat-sidebar-width-px'));
				if (Number.isFinite(storedSidebarWidth)) {
					document.documentElement.style.setProperty('--app-sidebar-width', `${Math.min(460, Math.max(220, storedSidebarWidth))}px`);
				}
			} catch {}
            try {
                const width = Number(localStorage.getItem('prsn-right-sidebar-width-px'));
                if (width >= 220) {
                    const left = innerWidth >= 1024 ? Number.parseFloat(document.documentElement.style.getPropertyValue('--app-sidebar-width')) || 272 : 0;
                    document.documentElement.style.setProperty('--app-right-sidebar-width', `${Math.max(220, Math.min(width, innerWidth - left - 180))}px`);
                }
                const saved = JSON.parse(localStorage.getItem('prsn-right-sidebar-open-by-route-v1') || '{}')[location.pathname];
                if (saved?.key) document.documentElement.classList.add('app-right-sidebar-restoring');
            } catch {}
		</script>
		<link
			rel="stylesheet"
			href="/build/{{APP_CSS}}"
		/>
		{{APP_BOOTSTRAP}}

			<div class="app-header-actions">

					<a href="/" data-spa-link>Home</a>
					<a href="/files" data-spa-link>Files</a>
				</nav>
				<span id="header-account" class="header-account"></span>

			type="module"

</html>
