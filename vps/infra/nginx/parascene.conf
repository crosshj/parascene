server {
	listen 80;
	server_name beta.parascene.com cdn.parascene.com;

	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	server_name beta.parascene.com cdn.parascene.com;

	ssl_certificate /etc/ssl/parascene/cert.pem;
	ssl_certificate_key /etc/ssl/parascene/key.pem;

	# Leave a small transport margin so the application owns the exact 50 MiB
	# policy and can return its structured error response.
	client_max_body_size 51m;
	proxy_request_buffering off;

	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
	}
}
