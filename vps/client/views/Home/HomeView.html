<section class="card home-card">
	<p class="eyebrow">Parascene beta</p>
	<h1>Welcome back.</h1>
	<p class="state">Your account is connected to the Parascene beta.</p>
	<p class="account">{{ACCOUNT_TEXT}}</p>
	<section class="home-view__sidebar-mock" aria-labelledby="sidebar-mock-title">
		<h2 id="sidebar-mock-title">Sidebar mock</h2>
		<p>Choose how much sample activity appears in the sidebar.</p>
		<div class="home-view__mock-modes" role="group" aria-label="Sidebar mock size">
			<label><input type="radio" name="sidebar-mock-mode" value="full" data-mock-mode> Full</label>
			<label><input type="radio" name="sidebar-mock-mode" value="minimal" data-mock-mode> Minimal</label>
		</div>
		<div class="home-view__mock-sections" data-mock-sections hidden>
			<label>Direct messages <select data-mock-section="directMessages"><option value="none">None</option><option value="minimal">Minimal (2)</option></select></label>
			<label>Servers <select data-mock-section="servers"><option value="none">None</option><option value="minimal">Minimal (2)</option></select></label>
			<label>Channels <select data-mock-section="channels"><option value="none">None</option><option value="minimal">Minimal (2)</option></select></label>
		</div>
	</section>
		<div class="home-view__actions">
		<a class="secondary-link" href="https://www.parascene.com">Go to the current app</a>
	</div>
</section>
