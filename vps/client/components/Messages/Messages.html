<template id="stream"><div class="chat-page-messages" data-chat-messages role="log" aria-label="Messages"></div></template>
<template id="history"><div data-chat-thread-load-sentinel="1" class="chat-page-thread-load-sentinel" aria-hidden="true" style="height:1px;margin:0;padding:0;flex-shrink:0;pointer-events:none"></div></template>
<template id="error"><p class="chat-page-error connect-chat-error" data-chat-error hidden role="alert"><span></span><button type="button" class="btn-outlined chat-page-pane-load-retry">Retry</button></p></template>
<template id="edit"><div class="connect-chat-msg-edit-dialog"><textarea class="connect-chat-msg-edit-input" rows="4" data-chat-message-edit-input maxlength="4000" aria-label="Edit message"></textarea><p class="connect-chat-msg-edit-error" data-chat-message-edit-error role="alert" hidden></p><div class="connect-chat-msg-edit-actions"><button type="button" class="connect-chat-msg-edit-cancel" data-chat-message-edit-cancel>Cancel</button><button type="button" class="btn-primary connect-chat-msg-edit-save" data-chat-message-edit-save><span class="connect-chat-msg-edit-save-label">Save</span><span class="connect-chat-msg-edit-save-spinner" aria-hidden="true"></span></button></div></div></template>
<template id="empty"><div class="chat-page-empty-hint" role="status">No messages yet. Send one below.</div></template>
<template id="failed"><div class="chat-page-optimistic-failed-line"><span class="chat-page-optimistic-failed-icon" aria-hidden="true"><svg class="chat-page-optimistic-failed-icon-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="currentColor"/><path fill="var(--bg)" d="M8 3.5c.41 0 .75.34.75.75v4.5a.75.75 0 01-1.5 0v-4.5c0-.41.34-.75.75-.75zm0 7a.75.75 0 110 1.5.75.75 0 010-1.5z"/></svg></span><span class="chat-page-optimistic-failed-copy">Failed to send. <button type="button" class="chat-page-optimistic-retry" aria-label="Retry sending message">Click here to retry.</button></span></div></template>
