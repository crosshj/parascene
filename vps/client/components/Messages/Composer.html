<template id="message-composer">
 <form class="beta-outlet__composer chat-page-composer connect-chat-composer" aria-label="Send a message" hidden>
  <div class="beta-outlet__composer-shell chat-page-input-shell">
   <div class="chat-page-composer-reply chat-page-composer-reply-strip" aria-live="polite" hidden><span class="chat-page-composer-reply-text"></span><button type="button" aria-label="Cancel reply">×</button></div>
   <div class="chat-page-composer-attachments" hidden><div class="chat-page-composer-attachments-row"><div class="chat-page-composer-attachments-list"></div></div></div>
   <p class="chat-page-composer-upload-error" role="alert" hidden></p>
   <div class="beta-outlet__composer-input-row chat-page-composer-input-row">
    <div class="chat-page-composer-attach-slot">
     <button type="button" class="chat-page-composer-attach-inline" aria-label="Add image">
      <svg class="chat-page-composer-attach-inline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
     </button>
    </div>
    <textarea class="connect-chat-composer-input chat-page-composer-input" name="body" rows="1" maxlength="4000" aria-label="Message text" placeholder="Write a message…"></textarea>
    <button type="submit" class="chat-page-send-btn" aria-label="Send message" hidden disabled></button>
   </div>
  </div>
 </form>
</template>
