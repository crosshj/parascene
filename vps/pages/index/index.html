<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta
			name="color-scheme"
			content="light dark"
		/>
		<meta
			name="description"
			content="Parascene — a community for creating and sharing with generative tools."
		/>
		<title>parascene</title>
		<style>
			:root {
				color-scheme: light dark;
				--font-family:
					system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial,
					sans-serif;
				--bg: #f6f7fb;
				--text: #0f172a;
				--text-muted: #525a6b;
				--accent: #7c3aed;
				--accent-text: #ffffff;
				--vl-video-bg: #d6d3e6;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0f0d1a;
					--text: #ede9fe;
					--text-muted: #9ca3af;
					--accent: #05c76f;
					--accent-text: #0f0d1a;
					--vl-video-bg: #1b152e;
				}
			}

			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			html {
				background: var(--bg);
			}

			body.vl-page {
				margin: 0;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				font-family: var(--font-family);
				background: var(--bg);
				color: var(--text);
				-webkit-font-smoothing: antialiased;
			}

			main {
				flex: 1;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				padding: 20px;
			}

			.vl-shell {
				width: 100%;
				max-width: 750px;
				text-align: center;
			}

			.vl-hero {
				display: flex;
				flex-direction: column;
				align-items: center;
				width: 100%;
			}

			.vl-logo {
				display: block;
				line-height: 0;
				text-decoration: none;
			}

			.vl-logo svg {
				display: block;
				width: 240px;
				height: auto;
				margin: 0 auto;
			}

			.vl-logo .logo-text {
				fill: #ffffff;
			}

			.vl-beta {
				display: inline-block;
				margin-left: 8px;
				padding: 4px 10px;
				border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
				border-radius: 999px;
				color: var(--accent);
				font-size: 0.7rem;
				font-weight: 700;
				letter-spacing: 0.14em;
				text-transform: uppercase;
			}

			.vl-brand-lockup {
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.vl-coming-soon {
				margin: 32px 0 0;
				font-size: clamp(2.75rem, 9vw, 5.5rem);
				font-weight: 700;
				letter-spacing: -0.05em;
				line-height: 1;
			}

			.vl-video {
				display: none;
				margin-top: 15px;
				position: relative;
				width: 100%;
				aspect-ratio: 16 / 9;
				border-radius: 10px;
				overflow: hidden;
				background: var(--vl-video-bg);
				cursor: pointer;
			}

			.vl-video-poster,
			.vl-video-media,
			.vl-video-overlay {
				position: absolute;
			}

			.vl-video-poster,
			.vl-video-overlay {
				inset: 0;
				width: 100%;
				height: 100%;
			}

			.vl-video-poster {
				object-fit: cover;
				object-position: center;
				transform: scale(1.06);
				opacity: 0;
				animation: vl-poster-drift 24s ease-in-out infinite alternate;
				transition: opacity 0.7s ease;
			}

			.vl-video-poster.is-shown {
				opacity: 1;
			}

			.vl-video.has-started .vl-video-poster {
				opacity: 0;
				pointer-events: none;
				animation: none;
			}

			@keyframes vl-poster-drift {
				from {
					transform: scale(1.06) translate(0, 0);
				}

				to {
					transform: scale(1.14) translate(-1.4%, 1.2%);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.vl-video-poster {
					animation: none;
					transform: none;
				}

				.vl-video-play.is-attention::before {
					animation: none;
				}
			}

			.vl-video-media {
				top: 50%;
				left: 50%;
				width: auto;
				height: 100%;
				min-width: 100%;
				max-width: none;
				transform: translate(-50%, -50%);
				object-fit: cover;
				object-position: center;
				opacity: 0;
				transition: opacity 0.25s ease;
			}

			.vl-video.is-playing .vl-video-media,
			.vl-video.has-started .vl-video-media {
				opacity: 1;
			}

			.vl-video-overlay {
				display: grid;
				place-items: center;
				background: rgba(0, 0, 0, 0.22);
				transition:
					opacity 0.25s ease,
					background 0.25s ease;
			}

			.vl-video.is-playing .vl-video-overlay {
				opacity: 0;
				pointer-events: none;
			}

			@media (hover: hover) and (pointer: fine) {
				.vl-video.is-playing:hover .vl-video-overlay {
					opacity: 1;
					pointer-events: auto;
					background: rgba(0, 0, 0, 0.2);
				}
			}

			.vl-video-play {
				position: relative;
				display: grid;
				place-items: center;
				width: 56px;
				height: 56px;
				padding: 0;
				border: none;
				border-radius: 50%;
				overflow: hidden;
				cursor: pointer;
				color: #fff;
				background: rgba(139, 92, 246, 0.42);
				backdrop-filter: blur(10px);
				-webkit-backdrop-filter: blur(10px);
				box-shadow: 0 2px 16px rgba(124, 58, 237, 0.25);
				transition:
					background 0.2s ease,
					transform 0.2s ease,
					box-shadow 0.2s ease;
				-webkit-tap-highlight-color: transparent;
			}

			@keyframes vl-play-shimmer {
				0% {
					transform: translateX(-160%);
					opacity: 0;
				}

				16% {
					opacity: 1;
				}

				100% {
					transform: translateX(160%);
					opacity: 0;
				}
			}

			.vl-video-play::before {
				content: '';
				position: absolute;
				inset: 0;
				border-radius: inherit;
				background: linear-gradient(
					115deg,
					transparent 28%,
					rgba(255, 255, 255, 0.2) 42%,
					rgba(255, 255, 255, 0.9) 50%,
					rgba(255, 255, 255, 0.2) 58%,
					transparent 72%
				);
				transform: translateX(-160%);
				opacity: 0;
				pointer-events: none;
			}

			.vl-video-play.is-attention::before {
				animation: vl-play-shimmer 0.9s ease-out forwards;
			}

			.vl-video-play:focus,
			.vl-video-play:focus-visible {
				outline: none;
			}

			.vl-video:hover .vl-video-play {
				background: rgba(167, 139, 250, 0.55);
				box-shadow: 0 4px 20px rgba(124, 58, 237, 0.35);
				transform: scale(1.04);
			}

			@media (prefers-color-scheme: dark) {
				.vl-video-play {
					background: rgba(167, 139, 250, 0.38);
					box-shadow: 0 2px 16px rgba(139, 92, 246, 0.3);
				}

				.vl-video:hover .vl-video-play {
					background: rgba(196, 181, 253, 0.52);
					box-shadow: 0 4px 20px rgba(167, 139, 250, 0.4);
				}
			}

			.vl-video-play svg {
				position: relative;
				z-index: 1;
				width: 22px;
				height: 22px;
			}

			.vl-icon-play {
				margin-left: 2px;
			}

			.vl-icon-pause {
				display: none;
			}

			.vl-video.is-playing .vl-icon-play {
				display: none;
			}

			.vl-video.is-playing .vl-icon-pause {
				display: block;
			}

			.vl-cta-row {
				display: none;
				--vl-cta-1: #5b329a;
				--vl-cta-2: #ab3eff;
				--vl-cta-3: #e9e3ff;
				--vl-cta-bg: linear-gradient(
					155deg,
					var(--vl-cta-1) 50%,
					var(--vl-cta-2) 80%,
					var(--vl-cta-3) 100%
				);
				--vl-cta-accent: #ce4cff;
				--vl-cta-text: #ffffff;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 10px;
				width: 100%;
				margin-top: 36px;
			}

			@media (prefers-color-scheme: dark) {
				.vl-cta-row {
					--vl-cta-1: #0a6464;
					--vl-cta-2: #00b4a0;
					--vl-cta-3: #00c8b4;
					--vl-cta-accent: rgba(0, 200, 180, 0.5);
					--vl-cta-text: #ffffff;
				}
			}

			@keyframes vl-cta-shimmer {
				0% {
					transform: translateX(-140%);
					opacity: 0;
				}

				18% {
					opacity: 1;
				}

				100% {
					transform: translateX(140%);
					opacity: 0;
				}
			}

			.vl-cta {
				position: relative;
				display: inline-block;
				padding: 14px 32px;
				font-size: 1.05rem;
				font-weight: 600;
				color: var(--vl-cta-text);
				text-decoration: none;
				border-radius: 999px;
				background: var(--vl-cta-bg);
				border: 0.25px solid var(--vl-cta-accent);
				box-shadow: 0 4px 20px
					color-mix(in srgb, var(--vl-cta-2) 35%, transparent);
				transition:
					transform 0.2s ease,
					filter 0.2s ease;
				overflow: hidden;
			}

			.vl-cta::before {
				content: '';
				position: absolute;
				inset: 0;
				border-radius: inherit;
				background: linear-gradient(
					105deg,
					transparent 8%,
					rgba(255, 255, 255, 0.16) 24%,
					rgba(255, 255, 255, 0.55) 50%,
					rgba(255, 255, 255, 0.16) 76%,
					transparent 92%
				);
				transform: translateX(-140%);
				opacity: 0;
				pointer-events: none;
			}

			.vl-cta.is-attention::before {
				animation: vl-cta-shimmer 0.75s ease-out forwards;
			}

			.vl-cta:hover {
				transform: translateY(-1px);
				filter: brightness(1.06);
				color: var(--vl-cta-text);
			}

			.vl-cta:focus-visible {
				outline: none;
				border-color: var(--vl-cta-accent);
			}

			.vl-footer {
				display: none;
				flex-shrink: 0;
				padding: 20px;
				text-align: center;
				font-size: 0.75rem;
				color: var(--text-muted);
			}

			.vl-footer a {
				color: inherit;
				text-decoration: none;
			}

			.vl-footer a:hover {
				color: var(--text);
				text-decoration: underline;
			}

			@media (max-width: 768px) {
				html {
					overflow: hidden;
					max-width: 100%;
					overscroll-behavior-x: none;
				}

				body.vl-page {
					overflow: hidden;
					height: 100dvh;
					max-height: 100dvh;
					min-height: 0;
					overscroll-behavior-x: none;
				}

				main {
					flex: 1 1 auto;
					min-height: 0;
					overflow: hidden;
					padding: 10px 0;
					width: 100%;
					max-width: 100%;
				}

				.vl-shell,
				.vl-hero {
					width: 100%;
					max-width: 100%;
					overflow-x: clip;
					min-height: 0;
				}

				.vl-logo,
				.vl-cta-row {
					padding-left: 20px;
					padding-right: 20px;
				}

				.vl-logo svg {
					width: 200px;
