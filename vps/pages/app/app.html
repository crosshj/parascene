<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<style>
		:root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
		body { margin: 0; min-height: 100vh; background: #f6f7fb; color: #0f172a; }
		header { display: flex; align-items: center; justify-content: space-between; min-height: 72px; padding: 0 24px; border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent); }
		main { max-width: 960px; margin: 0 auto; padding: 48px 24px; }
		.card { max-width: 560px; min-height: 128px; padding: 24px; border: 1px solid color-mix(in srgb, currentColor 15%, transparent); border-radius: 14px; }
		@media (prefers-color-scheme: dark) { body { background: #0f0d1a; color: #ede9fe; } }
	</style>
	<link rel="stylesheet" href="/build/app.css" />
	{{APP_BOOTSTRAP}}
	<title>parascene</title>
</head>
<body data-entry="app">
	<header>
		<a class="brand" href="/">parascene</a>
		<button id="logout" type="button">Log out</button>
	</header>
	<main>
		<section class="card">
			<h1>Welcome back</h1>
			<p id="account" class="muted">Signed in.</p>
			<p class="muted">Client route: <code id="client-route"></code></p>
		</section>
	</main>
	<script type="module" src="/build/app.js"></script>
</body>
</html>
