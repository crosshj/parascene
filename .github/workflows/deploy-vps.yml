name: Deploy to VPS

# A push to main must not deploy the VPS. The old job ran
# vps/scripts/deploy-from-ci.sh and replaced the beta container.
# Restore a real deploy when beta is merged and main should publish the prod slot.
on:
  workflow_dispatch:

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: VPS deploy is disabled on main
        run: echo "VPS deploy from main is off until beta is merged."
