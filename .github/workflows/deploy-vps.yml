name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: beta

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/vps-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/vps-ssh/id_ed25519"
          ssh-keyscan -H "$VPS_HOST" > "$RUNNER_TEMP/vps-ssh/known_hosts"

      - name: Package VPS app
        run: tar -czf "$RUNNER_TEMP/vps.tar.gz" -C vps .

      - name: Copy VPS app
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp \
            -i "$RUNNER_TEMP/vps-ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/vps-ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/vps.tar.gz" \
            "$VPS_USER@$VPS_HOST:/tmp/vps.tar.gz"

      - name: Build and restart container
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          printf '%s\n' \
            "SUPABASE_URL=$SUPABASE_URL" \
            "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" \
            "SESSION_SECRET=$SESSION_SECRET" | \
          ssh \
            -i "$RUNNER_TEMP/vps-ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/vps-ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'set -euo pipefail; install -d -m 755 "$HOME/parascene-vps"; umask 077; cat > "$HOME/parascene-vps/.env"; chmod 600 "$HOME/parascene-vps/.env"'

          ssh \
            -i "$RUNNER_TEMP/vps-ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/vps-ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            install -d -m 755 "$HOME/parascene-vps"
            tar -xzf /tmp/vps.tar.gz -C "$HOME/parascene-vps"
            rm -f /tmp/vps.tar.gz

            docker build --tag parascene:vps "$HOME/parascene-vps"
            docker rm --force parascene 2>/dev/null || true
            docker run --detach \
              --name parascene \
              --restart unless-stopped \
              --env-file "$HOME/parascene-vps/.env" \
              --publish 127.0.0.1:3000:3000 \
              parascene:vps
          REMOTE

      - name: Verify nginx to Docker path
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          for attempt in {1..30}; do
			if ssh \
				-i "$RUNNER_TEMP/vps-ssh/id_ed25519" \
				-o UserKnownHostsFile="$RUNNER_TEMP/vps-ssh/known_hosts" \
				-o StrictHostKeyChecking=yes \
				"$VPS_USER@$VPS_HOST" \
				"curl --fail --silent --show-error --output /dev/null --insecure https://localhost/ -H 'Host: beta.parascene.com'"; then
              exit 0
            fi
            sleep 2
          done

          ssh \
            -i "$RUNNER_TEMP/vps-ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/vps-ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'docker ps -a --filter name=parascene; docker logs --tail=200 parascene'
          exit 1
